name: Publish bot

# The bot is an rsbuild single-page app, so Pages serves a built bundle rather
# than the source. It publishes into this branch's root, which is what Pages
# serves by default — a gh-pages branch only works once somebody changes the
# repository setting, and a site nobody can reach is not published.
on:
  push:
    branches: [main]
    # Without this the workflow's own publish commit would trigger it again.
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'static/**'
      - 'assets/**'
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # A project site lives under /<repo>/; without this every asset 404s.
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Publish into the repository root
        run: |
          set -euo pipefail
          cp -r dist/. .
          # React Router owns the routes, so any deep link has to be served the
          # app rather than a 404 from the host.
          cp index.html 404.html
          # Without this, Pages runs the output through Jekyll and drops the
          # _-prefixed files a bundler emits.
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "published site already current"
          else
            git commit -qm "Publish bot build from ${GITHUB_SHA}"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi
