name: Publish desk

# The desk runs its whole engine in the page, so the site is static.
on:
  push:
    branches: [main]
    paths-ignore: ['index.html', '404.html', 'sw.js', 'manifest.webmanifest', 'icons/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-desk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify before publishing
        run: |
          npm run typecheck
          npm test
      - name: Build and publish to the repository root
        run: |
          set -euo pipefail
          npm run publish:local
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html manifest.webmanifest sw.js icons .nojekyll
          if git diff --cached --quiet; then
            echo "published site already current"
          else
            git commit -m "Publish desk build from ${GITHUB_SHA}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
